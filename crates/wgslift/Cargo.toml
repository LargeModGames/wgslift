[package]
name = "wgslift"
description = "Translates Direct3D 9 era HLSL shaders to WGSL"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["hlsl", "wgsl", "shader", "translator", "wgpu"]
categories = ["graphics", "rendering", "compilers"]

[dependencies]
wgslift-syntax = { path = "../wgslift-syntax", version = "0.1.1" }

[dev-dependencies]
naga = { version = "30.0.2", default-features = false, features = ["wgsl-in"] }

[[example]]
name = "milkdrop_translate"
test = true

[lints]
workspace = true
